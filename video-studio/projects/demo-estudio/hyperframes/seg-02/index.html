<!doctype html><html lang="pt-BR" data-resolution="landscape"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/><script src="gsap.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#0b1020}
#root{width:100%;height:100%;font-family:"Segoe UI",Arial,sans-serif;color:#f5f7ff;

.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 180px}
h1{font-size:96px;font-weight:800;letter-spacing:-.02em}.w{display:inline-block}

.bar{height:8px;width:260px;background:#4cc9f0;border-radius:4px;margin:32px 0}
ul{list-style:none}li{font-size:50px;margin:14px 0}li::before{content:"▸ ";color:#4cc9f0}
#orb{position:absolute;width:520px;height:520px;border-radius:50%;right:-120px;bottom:-160px;background:#4cc9f0;opacity:.18;filter:blur(20px)}</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="14.300" data-width="1920" data-height="1080" data-fps="30">
